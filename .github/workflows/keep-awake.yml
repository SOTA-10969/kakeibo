name: Keep Supabase awake

on:
  schedule:
    - cron: "0 3 * * 1,4"   # 毎週 月曜と木曜の 12:00（日本時間）
  workflow_dispatch:         # 手動でも実行できる

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase を起こす
        run: |
          URL="https://qblcbqueyjmoozwbtgie.supabase.co"
          KEY="$(echo sb_publishable_ZL1meXy... )"   # ← 下の注意を読んで差し替え
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" \
            "$URL/rest/v1/transactions?select=id&limit=1")
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "::error::Supabase が $code を返した"; exit 1; }
